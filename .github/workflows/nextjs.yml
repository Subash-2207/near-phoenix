name: Deploy PHOENIX dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check dashboard types
        run: npm run typecheck -w @phoenix/dashboard
      - name: Test dashboard logic
        run: |
          npm run test:wallet -w @phoenix/dashboard
          npm run test:evidence -w @phoenix/dashboard
          npm run test:transitions -w @phoenix/dashboard
      - name: Build dashboard workspace
        run: npm run build -w @phoenix/dashboard
      - name: Verify exported routes and assets
        run: node scripts/verify-static-export.mjs
      - name: Upload dashboard export
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
