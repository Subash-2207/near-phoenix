[package]
name = "phoenix-sandbox-tests"
version = "4.3.0"
edition = "2024"
publish = false

# Keep host-only RPC/sandbox dependencies out of contract WASM builds.
[workspace]

[dev-dependencies]
anyhow = "1"
near-workspaces = "=0.23.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

phoenix-recovery = { path = "../services/recovery" }
ed25519-dalek = "=2.2.0"

near-jsonrpc-client = { version = "=0.22.0", default-features = false, features = ["rustls-tls"] }
near-primitives = "=0.37.4"
