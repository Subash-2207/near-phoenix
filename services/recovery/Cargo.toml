[package]
name = "phoenix-recovery"
version = "4.3.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
phoenix-security-types = { path = "../../crates/security-types" }
anyhow = "1"
ed25519-dalek = "=2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync", "macros"] }
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
